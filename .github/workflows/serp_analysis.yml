name: SERP Analysis → Supabase

on:
  schedule:
    # Every Monday at 7:00 AM Brussels time (05:00 UTC)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to analyze'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - BENL
          - BEFR
      date:
        description: 'Scan date (YYYY-MM-DD, leave empty for today)'
        required: false
        default: ''

jobs:
  serp-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run SERP analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          MARKET="${{ github.event.inputs.market || 'ALL' }}"
          DATE_ARG="${{ github.event.inputs.date }}"
          
          if [ -n "$DATE_ARG" ]; then
            python scripts/serp_to_supabase.py --market "$MARKET" --date "$DATE_ARG"
          else
            python scripts/serp_to_supabase.py --market "$MARKET"
          fi

      - name: Summary
        if: always()
        run: echo "✅ SERP analysis completed for $(date '+%Y-%m-%d')"
